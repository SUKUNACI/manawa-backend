<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MANAWA — Connexion Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--orange:#F4720B;--dark:#0F1117;--dark2:#1A1D27;--dark3:#21253A;--border:rgba(255,255,255,0.08);--white:#F0F2F8;--muted:#8892A4;--red:#EF4444;--red-dim:rgba(239,68,68,0.1);}
body{background:var(--dark);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.box{background:var(--dark2);border:1px solid var(--border);border-radius:24px;padding:40px;width:400px;max-width:90vw;}
h1{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:var(--white);margin-bottom:4px;}
h1 span{color:var(--orange);}
.sub{font-size:13px;color:var(--muted);margin-bottom:28px;}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:0.5px;text-transform:uppercase;}
input{width:100%;background:var(--dark3);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--white);font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s;margin-bottom:16px;}
input:focus{border-color:var(--orange);}
.btn{width:100%;padding:14px;border-radius:12px;background:var(--orange);color:#fff;font-size:14px;font-weight:700;font-family:'DM Sans',sans-serif;border:none;cursor:pointer;transition:all .2s;margin-top:8px;}
.btn:hover{opacity:.9;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.err{background:var(--red-dim);border:1px solid rgba(239,68,68,0.25);color:var(--red);padding:10px 14px;border-radius:10px;font-size:12px;margin-bottom:16px;display:none;}
</style>
</head>
<body>
<div class="box">
  <h1>MAN<span>AWA</span></h1>
  <p class="sub">BACK-OFFICE ADMIN</p>
  <div class="err" id="err"></div>
  <label>Email</label>
  <input type="email" id="email" placeholder="Votre email admin" autocomplete="username">
  <label>Mot de passe</label>
  <input type="password" id="password" placeholder="Votre mot de passe" autocomplete="current-password">
  <button class="btn" id="btn">Se connecter</button>
</div>
<script src="/admin/login.js"></script>
</body>
</html>
